providers = ["node"]

[phases.setup]
nixPkgs = ["bun"]

# Node.js from its own nixpkgs pin so it takes security releases without moving
# Bun (Node.js Oct 2026 security release: 22.23.4).
[phases.node]
nixPkgs = ["nodejs_22"]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
dependsOn = ["setup"]
onlyIncludeFiles = [
  "package.json",
  "bun.lock",
  "apps/frontend/package.json",
  "apps/backend/package.json"
]
cacheDirectories = ["/root/.bun/install/cache"]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
dependsOn = ["install"]
cmds = ["bun run build"]

[start]
cmd = "bun run start"

[variables]
NODE_ENV = "production"
BUN_INSTALL_CACHE_DIR = "/root/.bun/install/cache"
