name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Our own PRs and pushes run on the Mac runners; outsiders' PRs (AGit via the github bot) on Linux
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The Mac uses Homebrew's bun; production is the Dockerfile's bun 1.4.4
      - if: runner.os == 'Linux'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Each runner instance has its own tool cache and runs one job at a time, so a missing
      # Foundry is installed there once (checked against the release's .sha256)
      - name: Use the runner's Foundry
        run: |
          dir="$RUNNER_TOOL_CACHE/foundry/1.7.1"
          if ! "$dir/forge" --version 2>/dev/null | grep -q 'Version: 1.7.1'; then
            case "$(uname -s)/$(uname -m)" in
              Darwin/arm64) target=darwin_arm64 ;;
              Linux/x86_64) target=linux_amd64 ;;
              *) echo "::error::No Foundry release for $(uname -s) $(uname -m)"; exit 1 ;;
            esac
            base="https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_$target"
            curl -fsSL -o "$RUNNER_TEMP/foundry.tar.gz" "$base.tar.gz"
            want="$(curl -fsSL "$base.sha256" | cut -d' ' -f1)"
            got="$( (sha256sum "$RUNNER_TEMP/foundry.tar.gz" 2>/dev/null || shasum -a 256 "$RUNNER_TEMP/foundry.tar.gz") | cut -d' ' -f1)"
            [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::Foundry 1.7.1 doesn't match its .sha256"; exit 1; }
            rm -rf "$dir" && mkdir -p "$dir" && tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$dir"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - run: forge test
      - run: bun install --frozen-lockfile
      # build type-checks both apps (tsc -b, tsc --noEmit) and bundles the frontend
      - run: bun run build
      - run: bun run test
